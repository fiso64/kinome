name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  # Builds the Nix package and uploads what it compiled to Kinome's binary cache,
  # so machines installing Kinome download it instead of compiling. Most of it is
  # ffmpeg with libplacebo, which nixpkgs' own cache does not carry.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
      - uses: cachix/cachix-action@v17
        with:
          name: kinome
          # Absent for pull requests from forks, which then only download.
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build --print-build-logs .#default
