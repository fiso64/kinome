<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content, viewport-fit=cover" />
  <title>Kinome</title>
  <!-- Lets phones add Kinome to the home screen as an app without browser bars. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Kinome" />
  <!-- The status bar is transparent over Kinome's own background. Pages leave room for it. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0e0e0f" />
  <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
  <!-- www.gstatic.com serves Google's Cast sender, loaded only when the viewer casts. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; worker-src 'self' blob:; img-src 'self' data: kinome-asset: https://image.tmdb.org; connect-src 'self' ws: http:; frame-src 'self' kinome:;" />
</head>

<body spellcheck="false">
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
